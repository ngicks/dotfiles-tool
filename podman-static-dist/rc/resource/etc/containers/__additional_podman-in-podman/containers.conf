# Should be in sync with ../containers.conf
[containers]
# /sys/fs/cgroup is mounted read-only inside the devenv container, so nested
# podman cannot create cgroups there; run nested containers without them.
cgroups = "disabled"
# /dev/net/tun is absent inside the devenv container, so pasta cannot set up
# a tap device; share the devenv container's own network namespace instead.
netns = "host"

[engine]
cgroup_manager = "cgroupfs"
conmon_path=["/root/.local/share/podman-dist/current/usr/local/lib/podman/conmon"]
events_logger="file"
helper_binaries_dir=["/root/.local/share/podman-dist/current/usr/local/bin", "/root/.local/share/podman-dist/current/usr/local/lib/podman"]
